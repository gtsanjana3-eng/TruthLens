# Production-style stack: PostgreSQL + FastAPI backend + nginx-served React frontend.
# Usage:  JWT_SECRET=$(python -c "import secrets;print(secrets.token_urlsafe(48))") POSTGRES_PASSWORD=... docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truthlens
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U truthlens"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://truthlens:${POSTGRES_PASSWORD}@db:5432/truthlens
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: http://localhost:8080
      PORT: "8000"
    volumes: [evidence:/home/user/data]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
  evidence:
